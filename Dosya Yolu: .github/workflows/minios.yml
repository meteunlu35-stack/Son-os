name: MiniOS
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y genisoimage unzip
      - run: mkdir iso && unzip -q minios-os.zip -d iso
      - run: genisoimage -o MiniOS.iso -V MiniOS -R -J iso
      - uses: actions/upload-artifact@v4
        with:
          name: MiniOS
          path: MiniOS.iso
